<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>똥 홈런 마스터</title><style>
:root{--ink:#2b140c;--cream:#fff4cc}*{box-sizing:border-box}body{margin:0;background:linear-gradient(#5ac5ef 50%,#75c94e 50%);font-family:Arial Rounded MT Bold,Trebuchet MS,system-ui,sans-serif;color:var(--ink);user-select:none}.app{width:min(1100px,100%);margin:auto;padding:10px}header{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}.logo{color:#fff;text-align:center;font-size:clamp(23px,4vw,43px);line-height:.9;text-shadow:0 4px #74301c,0 7px #0003}.logo small{display:block;font-size:10px;letter-spacing:2px;margin-top:8px}.stat{padding:8px 12px;border:3px solid var(--ink);border-radius:15px;background:#fff8dfee;box-shadow:0 5px #2b140c55}.stat:last-child{text-align:right}.stat span{display:block;font-size:11px;color:#795647}.stat b{font-size:clamp(16px,2.5vw,24px)}.stage{position:relative;overflow:hidden;border:5px solid var(--ink);border-radius:23px;box-shadow:0 9px #2b140c55}canvas{display:block;width:100%;aspect-ratio:16/9;touch-action:manipulation;cursor:crosshair}.hud{pointer-events:none;position:absolute;inset:0;display:flex;justify-content:center}.phase{position:absolute;top:12px;padding:6px 15px;border:3px solid var(--ink);border-radius:99px;background:#2b140ccc;color:#fff;font-weight:900}.msg{position:absolute;top:18%;width:100%;text-align:center;font-size:clamp(30px,8vw,80px);font-weight:1000;color:#fff;-webkit-text-stroke:3px var(--ink);text-shadow:0 7px #0004;opacity:0;transform:scale(.4);transition:.2s}.msg.on{opacity:1;transform:scale(1) rotate(-2deg)}.msg.gold{color:#fff25b}.msg.rainbow{background:linear-gradient(90deg,#f44,#fd4,#4e6,#4cf,#c5f);background-clip:text;color:transparent}.hint{position:absolute;bottom:4%;padding:8px 16px;border-radius:99px;background:#ffffffe8;font-weight:900;animation:b .7s infinite alternate}@keyframes b{to{transform:translateY(-5px)}}.power{position:absolute;left:12%;right:12%;bottom:10%;opacity:0;transform:translateY(15px);transition:.2s}.power.on{opacity:1;transform:none}.power p{color:#f nt-weight:900;transition:.2s}.toast.on{opacity:1;transform:translate(-50%,0)}@media(max-width:620px){header{grid-template-columns:1fr 1fr}.logo{grid-column:1/-1;grid-row:1}.stat{grid-row:2}.buttons{grid-template-columns:1fr 1fr}.stage{border-width:3px}}
</style></head><body><main class="app"><header><div class="stat"><span>현재 거리</span><b id="dist">0 m</b></div><h1 class="logo">똥 홈런 마스터<small>POOP HOME RUN MASTER</small></h1><div class="stat"><span>최고 기록 · 코인</span><b><i id="best">0 m</i> · 🟡 <i id="coins">0</i></b></div></header><section class="stage"><canvas id="game" width="1280" height="720"></canvas><div class="hud"><div class="phase" id="phase">경기 준비</div><div class="msg" id="msg"></div><div class="power" id="power"><p>한 번 더 클릭! 파워를 정하자!</p><div class="bar"><i class="cell"></i><i class="cell"></i><i class="cell"></i><i class="cell"></i><i class="cell"></i><i class="cell"></i><i class="cell"></i><i class="cell"></i><i class="cell"></i><i class="cell"></i><b class="needle" id="needle"></b></div></div><div class="hint" id="hint">시작 버튼을 눌러 도전하세요!</div></div></section><nav class="buttons"><button id="start">삽 들고 시작!</button><button data-open="up">🔧 업그레이드</button><button data-open="rank">🏆 랭킹</button><button data-open="ach">⭐ 업적</button></nav></main><div class="modal" id="up"><div class="panel"><div class="head"><h2>삽질 연구소</h2><button class="close">×</button></div><div id="upList"></div></div></div><div class="modal" id="rank"><div class="panel"><div class="head"><h2>동네 홈런 랭킹</h2><button class="close">×</button></div><div id="rankList"></div></div></div><div class="modal" id="ach"><div class="panel"><div class="head"><h2>기묘한 업적</h2><button class="close">×</button></div><div id="achList"></div></div></div><div class="toast" id="toast"></div><script>
(()=>{'use strict';const C=document.querySelector('#game'),c=C.getContext('2d'),$=s=>document.querySelector(s),W=1280,H=720,TAU=Math.PI*2,KEY='poopHomer.v1',ui={phase:$('#phase'),msg:$('#msg'),power:$('#power'),needle:$('#needle'),hint:$('#hint'),start:$('#start'),dist:$('#dist'),best:$('#best'),coins:$('#coins'),toast:$('#toast')};const REG=[['동네',0,'#70cff4','#74bd4d'],['논밭',100,'#78d7f5','#d1c948'],['도시',250,'#80bfd5','#5c6269'],['산',500,'#6db9e5','#357044'],['바다',900,'#51b7ed','#147dc4'],['해외',1500,'#ee9772','#c6a56d'],['우주',2500,'#090722','#403858']],UPS={shovel:['삽 강화','기본 거리 +8%',35],muscle:['근력 강화','파워 +7%',40],focus:['집중력 강화','판정 구간 확대',45],lucky:['럭키 보너스','랜덤 보너스 상승',50],critical:['크리티컬','2배 확률 상승',55]},ACHS={first:['첫 타격','무언가를 삽으로 쳤다','🥄'],m100:['100m 돌파','동네 밖으로 날렸다','🏘️'],m500:['500m 돌파','산 너머까지 날렸다','⛰️'],km1:['1km 돌파','단위가 바뀌었다','🚀'],p10:['10연속 Perfect','삽질의 신','👑'],gold:['황금똥 적중','냄새나는 횡재','✨'],space:['우주 도달','중력도 포기했다','🪐']},DEF={coins:0,plays:0,best:0,ranks:[],ups:{shovel:0,muscle:0,focus:0,lucky:0,critical:0},achs:{},streak:0};let S;try{let p=JSON.parse(localStorage.getItem(KEY));S={...DEF,...p,ups:{...DEF.ups,...p.ups},achs:{...p.achs}}}catch{S=structuredClone(DEF)}let state='idle',last=0,time=0,approach=0,power=.1,dir=1,grade='',distance=0,shown=0,flight=0,type='normal',parts=[],splats=[],flies=[],shake=0,audio;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),rand=(a,b)=>a+Math.random()*(b-a),fmt=v=>v>=1000?(v/1000).toFixed(2)+' km':Math.round(v)+' m',save=()=>localStorage.setItem(KEY,JSON.stringify(S));function sync(){ui.dist.textContent=fmt(shown);ui.best.textContent=fmt(S.best);ui.coins.textContent=S.coins}function say(t,k=''){ui.msg.textContent=t;ui.msg.className='msg on '+k;clearTimeout(say.t);say.t=setTimeout(()=>ui.msg.classList.remove('on'),1100)}function toast(t){ui.toast.textContent=t;ui.toast.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>ui.toast.classList.remove('on'),2000)}function snd(kind){if(!audio)audio=new(window.AudioContext||window.webkitAudioContext);audio.resume();let o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime;o.connect(g).connect(audio.destination);o.type=kind==='hit'?'sawtooth':kind==='miss'?'square':'sine';o.frequency.setValueAtTime(kind==='hit'?180:kind==='miss'?100:650,t);o.frequency.exponentialRampToValueAtTime(kind==='hit'?55:kind==='miss'?45:950,t+.3);g.gain.setValueAtTime(.18,t);g.gain.exponentialRampToValueAtTime(.001,t+.45);o.start();o.stop(t+.5)}function rarity(){let r=Math.random();return r<.004?'rainbow':r<.011?'nuclear':r<.026?'diamond':r<.075?'golden':'normal'}function color(){return{normal:'#6d351f',golden:'#ffd52f',diamond:'#78e9ff',nuclear:'#7df542',rainbow:'#ff70d5'}[type]}
function begin(){snd('coin');state='timing';time=approach=distance=shown=0;parts=[];splats=[];flies=[];type=rarity();ui.start.textContent='날아오는 중...';ui.phase.textContent='1단계 · 타이밍';ui.hint.textContent='과녁 중심에서 클릭!';ui.hint.style.display='';let n={golden:'황금똥 출현!',diamond:'다이아똥 출현!',nuclear:'핵똥 출현!',rainbow:'전설의 무지개똥!'}[type];if(n)say(n,type==='rainbow'?'rainbow':'gold')}function judge(){let e=Math.abs(approach-.78),f=S.ups.focus*.006;grade=e<=.03+f?'Perfect':e<=.08+f?'Great':e<=.15+f?'Good':e<=.25+f?'Bad':'Miss';if(grade==='Miss')return fail();state='power';power=Math.random();ui.power.classList.add('on');ui.hint.style.display='none';ui.phase.textContent='2단계 · 파워 ('+grade+')';say(grade,grade==='Perfect'?'gold':'')}function powerHit(){let p=clamp(Math.ceil((1-Math.abs(power-.5)*2)*10),1,10),superP=Math.abs(power-.5)<.045,m={Perfect:1,Great:.72,Good:.43,Bad:.17}[grade],crit=Math.random()<.03+S.ups.critical*.025,rare={normal:1,golden:3,diamond:10,nuclear:7,rainbow:14}[type];distance=Math.round(640*(1+S.ups.shovel*.08)*m*(.2+p*.08+S.ups.muscle*.07)*rand(.83,1.12+S.ups.lucky*.035)*rare*(superP?1.22:1)*(crit?2:1));if(type==='nuclear')distance=Math.max(3000,distance);state='hit';time=0;shake=grade==='Perfect'?25:12;ui.power.classList.remove('on');ui.phase.textContent='날려버렸다!';say(superP?'SUPER POWER!':crit?'CRITICAL ×2!':p+' POWER',superP?'gold':'');snd('hit');burst(800,400,50);setTimeout(()=>{if(state==='hit'){state='flight';flight=0;ui.phase.textContent='비거리 측정 중'}},500)}function fail(){state='miss';ui.phase.textContent='타격 실패';ui.start.textContent='다시 도전';ui.hint.textContent='이건... 씻어도 냄새가...';say('똥벼락!');snd('miss');splats=Array.from({length:16},()=>[rand(50,W-50),rand(40,H-30),rand(20,65)]);flies=Array.from({length:12},()=>[rand(250,950),rand(100,570),rand(0,TAU)]);burst(790,380,80);finish(0)}function unlock(id,ok){if(ok&&!S.achs[id]){S.achs[id]=1;setTimeout(()=>{toast('업적 달성! '+ACHS[id][0]);snd('coin')},700)}}function finish(d){S.plays++;S.streak=grade==='Perfect'?S.streak+1:0;let coin=d?Math.max(3,Math.floor(Math.sqrt(d)*1.7)):0;S.coins+=coin;if(d){S.best=Math.max(S.best,d);S.ranks.push({d,date:new Date().toLocaleDateString('ko-KR'),play:S.plays});S.ranks.sort((a,b)=>b.d-a.d);S.ranks=S.ranks.slice(0,10)}unlock('first',d>0);unlock('m100',d>=100);unlock('m500',d>=500);unlock('km1',d>=1000);unlock('p10',S.streak>=10);unlock('gold',type==='golden'&&d);unlock('space',d>=2500);save();sync();if(coin)setTimeout(()=>toast('비거리 코인 +'+coin),1000)}function burst(X,Y,n){for(let i=0;i<n;i++){let a=rand(0,TAU),s=rand(80,500);parts.push({x:X,y:Y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:rand(.5,1.2),r:rand(3,12)})}}
function update(dt){time+=dt;shake*=.91;parts.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=500*dt;p.l-=dt});parts=parts.filter(p=>p.l>0);if(state==='timing'){approach+=dt*.205;if(approach>1.15)fail()}else if(state==='power'){power+=dir*dt*(1.45-S.ups.focus*.035);if(power<0||power>1){dir*=-1;power=clamp(power,0,1)}ui.needle.style.left=`calc(${power*100}% - 4px)`}else if(state==='flight'){flight+=dt;let dur=clamp(2.6+Math.log10(distance+1)*.8,2.6,6),t=clamp(flight/dur,0,1);shown=distance*(1-(1-t)**2.4);sync();if(t===1){state='result';ui.phase.textContent=reg(distance)[0]+' 착륙';ui.start.textContent='한 판 더!';ui.hint.style.display='';ui.hint.textContent=fmt(distance)+'! 버튼을 눌러 재도전';say('비거리 '+fmt(distance)+'!',distance>=2500?'rainbow':'gold');finish(distance)}}}function reg(d){let r=REG[0];REG.forEach(q=>{if(d>=q[1])r=q});return r}function bg(d){let r=reg(d);c.fillStyle=r[2];c.fillRect(0,0,W,H);if(r[0]==='우주'){for(let i=0;i<75;i++){c.fillStyle=i%6?'#fff':'#ffdc4b';c.fillRect((i*173-d*.3)%(W+50),(i*97)%500,i%4?2:4,i%4?2:4)}}else{c.fillStyle='#fff0a5';c.beginPath();c.arc(1080,100,55,0,TAU);c.fill();cloud((200-d*.2)%1450,130);cloud((720-d*.13)%1500,210)}c.fillStyle=r[3];c.fillRect(0,470,W,250);scenery(r[0],d);c.fillStyle='#2b140ccc';c.beginPath();c.roundRect(22,22,150,48,14);c.fill();c.fillStyle='#fff';c.font='900 22px sans-serif';c.textAlign='center';c.fillText(r[0],97,54)}function cloud(X,Y){c.fillStyle='#ffffffdd';[[-35,15,30],[0,0,42],[42,17,34]].forEach(q=>{c.beginPath();c.arc(X+q[0],Y+q[1],q[2],0,TAU);c.fill()})}function scenery(n,d){if(n==='동네'||n==='도시'){for(let i=-1;i<11;i++){let X=(i*160-d*1.5)%1800-100,h=n==='도시'?160+(i*47%210):140;c.fillStyle=n==='도시'?['#596a78','#786a78'][Math.abs(i)%2]:['#ffe3a0','#ffad67'][Math.abs(i)%2];c.fillRect(X,500-h,125,h);if(n==='동네'){c.fillStyle='#a84c38';c.beginPath();c.moveTo(X-15,360);c.lineTo(X+62,300);c.lineTo(X+140,360);c.fill()}}}else if(n==='산'){c.fillStyle='#285d3c';for(let i=-1;i<6;i++){let X=(i*390-d*.7)%2100-200;c.beginPath();c.moveTo(X,500);c.lineTo(X+210,210);c.lineTo(X+430,500);c.fill()}}else if(n==='바다'){c.fillStyle='#147dc4';c.fillRect(0,460,W,260);c.strokeStyle='#8ce5ff';c.lineWidth=7;for(let y=500;y<700;y+=45){c.beginPath();c.moveTo(0,y);c.lineTo(W,y);c.stroke()}}else if(n==='해외'){let X=(800-d*.8)%1600;c.strokeStyle='#4d5853';c.lineWidth=14;c.beginPath();c.moveTo(X,510);c.lineTo(X+70,210);c.lineTo(X+140,510);c.stroke()}}
function target(){for(let q of [[180,'#7d452a33'],[135,'#fff4'],[95,'#ffd23f55'],[60,'#ff642f66'],[27,'#fff45ccc']]){c.fillStyle=q[1];c.strokeStyle='#2b140c88';c.lineWidth=3;c.beginPath();c.arc(790,382,q[0],0,TAU);c.fill();c.stroke()}}function poop(X,Y,s,rot=0){c.save();c.translate(X,Y);c.rotate(rot);c.scale(s,s);c.fillStyle=color();c.strokeStyle='#2b140c';c.lineWidth=7;c.beginPath();c.moveTo(-70,55);c.bezierCurveTo(-90,15,-60,-5,-40,-8);c.bezierCurveTo(-58,-38,-25,-55,-8,-49);c.bezierCurveTo(-12,-80,20,-88,28,-57);c.bezierCurveTo(62,-61,70,-28,50,-10);c.bezierCurveTo(95,0,88,45,65,56);c.closePath();c.fill();c.stroke();c.fillStyle='#21120d';c.beginPath();c.arc(-26,8,8,0,TAU);c.arc(28,8,8,0,TAU);c.fill();c.restore()}function person(){let X=340,Y=470;c.strokeStyle='#2b140c';c.lineWidth=18;c.beginPath();c.moveTo(X-25,Y+90);c.lineTo(X-45,Y+175);c.moveTo(X+30,Y+90);c.lineTo(X+55,Y+175);c.stroke();c.fillStyle='#f36c35';c.strokeStyle='#2b140c';c.lineWidth=7;c.beginPath();c.roundRect(X-60,Y,120,115,38);c.fill();c.stroke();c.fillStyle='#ffd09b';c.beginPath();c.arc(X,Y-60,78,0,TAU);c.fill();c.stroke();c.fillStyle='#44251c';c.beginPath();c.arc(X,Y-88,68,Math.PI,TAU);c.fill();c.fillStyle='#21120d';c.beginPath();c.arc(X-27,Y-52,7,0,TAU);c.arc(X+27,Y-52,7,0,TAU);c.fill();if(state==='miss'){c.fillStyle='#67351f';c.beginPath();c.arc(X+12,Y-55,28,0,TAU);c.fill()}c.save();c.translate(X+50,Y+25);c.rotate(state==='hit'?-1.7:-.55);c.strokeStyle='#75442b';c.lineWidth=14;c.beginPath();c.moveTo(0,0);c.lineTo(190,0);c.stroke();c.fillStyle='#aeb6b8';c.strokeStyle='#2b140c';c.lineWidth=6;c.beginPath();c.moveTo(170,-36);c.quadraticCurveTo(240,-50,245,0);c.quadraticCurveTo(235,50,170,36);c.closePath();c.fill();c.stroke();c.restore()}
function draw(){c.save();if(shake>.3)c.translate(rand(-shake,shake),rand(-shake,shake));bg(state==='flight'||state==='result'?shown:0);if(['idle','timing','power','hit','miss'].includes(state)){target();person()}if(state==='timing')poop(790,382,.12+approach*1.38,approach*2);else if(state==='power')poop(790,382,1.15);else if(state==='hit')poop(790+time*700,382-time*220,1.15,time*8);else if(state==='flight'||state==='result'){let dur=clamp(2.6+Math.log10(distance+1)*.8,2.6,6),t=clamp(flight/dur,0,1),X=220+810*t,Y=510-Math.sin(t*Math.PI)*360;c.strokeStyle=type==='rainbow'?'#ff65d7':'#ffffffaa';c.lineWidth=16;c.beginPath();c.moveTo(X-220,Y+50);c.lineTo(X,Y);c.stroke();poop(X,Y,.8+Math.sin(t*Math.PI)*.3,flight*5)}if(state==='miss'){splats.forEach(s=>{c.fillStyle='#5a2b19aa';c.beginPath();c.arc(...s,0,TAU);c.fill()});flies.forEach(f=>{f[2]+=.12;let X=f[0]+Math.cos(f[2])*65,Y=f[1]+Math.sin(f[2]*1.7)*30;c.fillStyle='#111';c.beginPath();c.ellipse(X,Y,7,4,f[2],0,TAU);c.fill()})}parts.forEach(p=>{c.globalAlpha=clamp(p.l,0,1);c.fillStyle=color();c.beginPath();c.arc(p.x,p.y,p.r,0,TAU);c.fill()});c.globalAlpha=1;c.restore()}function loop(t){let dt=Math.min((t-last)/1000||0,.033);last=t;update(dt);draw();requestAnimationFrame(loop)}
C.onpointerdown=()=>state==='timing'?judge():state==='power'?powerHit():0;ui.start.onclick=()=>{if(['idle','result','miss'].includes(state))begin()};function upList(){$('#upList').innerHTML=Object.entries(UPS).map(([id,u])=>{let l=S.ups[id],cost=Math.round(u[2]*1.55**l);return `<div class="row"><div><b>${u[0]} Lv.${l}</b><small>${u[1]} · 최대 Lv.10</small></div><button data-up="${id}" ${l>=10||S.coins<cost?'disabled':''}>${l>=10?'MAX':cost+' 코인'}</button></div>`}).join('')}function ranks(){$('#rankList').innerHTML=S.ranks.length?S.ranks.map((r,i)=>`<div class="row rank"><b>${i+1}</b><span>${r.date}<small>${r.play}번째 플레이</small></span><strong>${fmt(r.d)}</strong></div>`).join(''):'<p>아직 기록이 없습니다.</p>'}function achs(){$('#achList').innerHTML=Object.entries(ACHS).map(([id,a])=>`<div class="row ${S.achs[id]?'':'locked'}"><div><b>${a[0]}</b><small>${a[1]}</small></div><b>${S.achs[id]?a[2]:'🔒'}</b></div>`).join('')}document.onclick=e=>{let o=e.target.closest('[data-open]');if(o){({up:upList,rank:ranks,ach:achs}[o.dataset.open])();$('#'+o.dataset.open).classList.add('on')}if(e.target.matches('.close')||e.target.matches('.modal'))e.target.closest('.modal').classList.remove('on');let b=e.target.closest('[data-up]');if(b){let id=b.dataset.up,l=S.ups[id],cost=Math.round(UPS[id][2]*1.55**l);if(S.coins>=cost&&l<10){S.coins-=cost;S.ups[id]++;save();sync();upList();snd('coin')}}};onkeydown=e=>{if((e.code==='Space'||e.code==='Enter')&&!$('.modal.on')){e.preventDefault();if(['idle','result','miss'].includes(state))begin();else if(state==='timing')judge();else if(state==='power')powerHit()}};sync();requestAnimationFrame(loop)})();
</script></body></html>
